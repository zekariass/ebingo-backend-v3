version: '3.9'

networks:
  test_net:
    driver: bridge

volumes:
  postgres_data_test:
  redis_data_test:

services:
  app:
    image: zekariasn/ebingo-backend:test-latest
    container_name: ebingo-backend-test
    env_file: .env
    environment:
      - JAVA_OPTS=-Xms512m -Xmx2g
      - REDIS_HOST=redis-test
      - REDIS_PORT=6380
      - EBINGO_DB_HOST=postgres-test
      - EBINGO_DB_PORT=5433
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - test_net

  postgres-test:
    image: postgres:17.6
    container_name: ebingo-db-test
    env_file: .env
    environment:
      POSTGRES_DB: ${EBINGO_DB_NAME}
      POSTGRES_USER: ${EBINGO_DB_USER}
      POSTGRES_PASSWORD: ${EBINGO_DB_PASSWORD}
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EBINGO_DB_USER} -d ${EBINGO_DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "5433:5432"
    networks:
      - test_net

  redis-test:
    image: redis:7
    container_name: ebingo-redis-test
    command: redis-server --appendonly yes
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - test_net

  nginx:
    image: nginx:latest
    container_name: ebingo-nginx-test
    depends_on:
      - app
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - test_net
