server {
    listen 8080;
    server_name api-test.bingofam.com;

    # Redirect HTTP to HTTPS (use same test ports)
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name api-test.bingofam.com;

    # SSL certificates (separate test certs)
    ssl_certificate /etc/letsencrypt/live/api-test.bingofam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.bingofam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API endpoints
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            return 204;
        }
    }

    # Health check (optional)
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Logs
    access_log /var/log/nginx/ebingo-test-access.log;
    error_log /var/log/nginx/ebingo-test-error.log;
}
